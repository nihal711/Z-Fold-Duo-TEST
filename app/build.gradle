plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.foldduo.hinge'
    // Android 17 is published as SDK platform 37.0; without the minor part AGP
    // looks for a platform hash of "android-37" that no longer exists.
    compileSdk 37
    compileSdkMinor 0

    defaultConfig {
        applicationId 'com.foldduo.hinge'
        minSdk 33
        targetSdk 37
        versionCode 70
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
        aidl true
    }
}

dependencies {
    implementation 'com.flyfishxu:kadb:2.1.4'
    implementation 'com.flyfishxu:kadb-mdns:2.1.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'
    testImplementation 'junit:junit:4.13.2'
}
